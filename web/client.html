<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>客户门户 · 批准 / 验收 / 下载</title><style>
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;background:#fafaf7;color:#1f2330}
header{padding:20px 30px;border-bottom:1px solid #e5e7eb;background:#fff}
.wrap{max-width:920px;margin:24px auto;padding:0 20px 80px}
input,textarea,select{padding:9px 11px;border:1px solid #d5d9e2;border-radius:9px;font-size:14px}
button{background:#5b6ee1;color:#fff;border:0;border-radius:9px;padding:9px 14px;font-size:13px;cursor:pointer;margin:3px 0}
.ghost{background:#fff;color:#1f2330;border:1px solid #d5d9e2}
.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin:14px 0}
h2{font-size:17px} h3{font-size:15px;margin:14px 0 8px}
.muted{color:#6b7280;font-size:12px} pre{background:#f4f5f8;border-radius:8px;padding:10px;font-size:11px;overflow:auto;max-height:220px}
.pill{font-size:11px;border-radius:999px;padding:2px 9px;background:#eef0ff;color:#3b49b0;margin-right:6px}
.pill.warn{background:#fdf0e0;color:#a25b12}.pill.ok{background:#e7f6ee;color:#1a7f4b}
.pill.bad{background:#fdecec;color:#b33838} a{color:#5b6ee1}
</style></head><body>
<header><a href="index.html">← 返回</a>　<strong>客户门户</strong></header>
<div class="wrap">
  <div class="box">
    访问令牌（由管理后台创建客户时获得，写入 capability URL）：
    <input id="token" style="width:60%" placeholder="粘贴 access_token"/>
    <button onclick="load()">进入</button>
    <span id="me" class="muted"></span>
  </div>
  <div id="content"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let H={};
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-Client-Token':$('#token').value.trim()},
    body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.detail||r.status);
  return d;
}
async function load(){
 H={'X-Client-Token':$('#token').value.trim()};
 try{
  const me=await api('GET','/api/client/me'); $('#me').textContent='你好，'+me.name;
  const ps=await api('GET','/api/client/projects');
  let html='';
  for(const p of ps){
    html+=`<div class="box"><h2>${esc(p.title)} <span class="pill ${p.frozen?'bad':'ok'}">${p.frozen?'已整包冻结':'进行中'} · ${p.freeze_mode==='package'?'整包模式':'逐阶段模式'}</span></h2>`;
    if(p.work_id){
      const w=await api('GET','/api/client/works/'+p.work_id);
      html+='<h3>版本</h3>'+w.versions.map(v=>`<div>v${v.seq} · ${esc(v.label)}
        <span class="muted">[${v.asset_kinds.join(',')}]</span>
        <button class="ghost" onclick="approve(${v.id},'${esc(v.label)}')">批准此版本（冻结快照）</button>
        <button class="ghost" onclick="drift(${v.id})">查看批准/最新差异</button>
        </div>`).join('');
    }
    html+=`<h3>验收（两方必须确认同一组版本/文件）</h3>
      <div id="acc-${p.id}"></div>
      <p><button onclick="newAcceptance(${p.id},${p.work_id})">按作品全部版本发起验收</button></p>
      <h3>交付包</h3><div id="pkg-${p.id}"></div>
      <button class="ghost" onclick="loadAcceptances(${p.id})">刷新验收/交付</button>
      </div>`;
  }
  $('#content').innerHTML=html||'<p class="muted">暂无委托项目</p>';
  ps.forEach(p=>loadAcceptances(p.id));
 }catch(e){$('#me').textContent='❌ '+e.message}
}
async function approve(vid,label){
 const note=prompt('批准备注（可留空）','')??'';
 try{const d=await api('POST','/api/client/approvals',{version_id:vid,note});
   alert(`已批准：批准对象指纹 ${d.asset_fingerprint.slice(0,16)}…\n之后的新文件不会改变该批准。`);
 }catch(e){alert('❌ '+e.message)}
}
async function drift(vid){
 try{
  const list=await api('GET','/api/client/versions/'+vid+'/approvals');
  if(!list.length)return alert('该版本还没有批准记录');
  alert(list.map(a=>`批准 #${a.approval_id} ${a.superseded?'(已被新批准取代)':''}
批准时指纹: ${a.approved_fingerprint.slice(0,16)}…
当前指纹:   ${a.current_fingerprint.slice(0,16)}…
状态: ${a.changed?'⚠️ 批准后文件已变更（最新文件不等于已批准对象）':'✅ 与批准时一致'}`).join('\n\n'));
 }catch(e){alert('❌ '+e.message)}
}
async function newAcceptance(pid,wid){
 try{
  const w=await api('GET','/api/client/works/'+wid);
  const d=await api('POST','/api/client/acceptances',{project_id:pid,version_ids:w.versions.map(v=>v.id)});
  localStorage.setItem('accItems-'+d.acceptance_id,JSON.stringify(d.items));
  alert('验收单 #'+d.acceptance_id+' 已创建，双方需确认同一清单');
  loadAcceptances(pid);
 }catch(e){alert('❌ '+e.message)}
}
async function loadAcceptances(pid){
 const accs=await api('GET','/api/client/acceptances?project_id='+pid);
 const pkgs=await api('GET','/api/client/packages?project_id='+pid);
 $('#acc-'+pid).innerHTML=accs.map(a=>`<div style="border-top:1px dashed #eee;padding:8px 0">
   验收单 #${a.id}
   <span class="pill ${a.completed?'ok':a.cancelled?'bad':'warn'}">${a.cancelled?'已取消':a.completed?'已完成':'进行中'}</span>
   <span class="pill ${a.artist_confirmed?'ok':''}">作者${a.artist_confirmed?'✓':'…'}</span>
   <span class="pill ${a.client_confirmed?'ok':''}">客户${a.client_confirmed?'✓':'…'}</span>
   <details><summary class="muted">清单指纹 ${a.fingerprint.slice(0,12)}…（${a.items.length} 项）</summary><pre>${esc(JSON.stringify(a.items,null,2))}</pre></details>
   ${a.completed?'':`
     <button class="ghost" onclick="confirmSide(${a.id},'artist',${p.id})">作者确认此清单</button>
     <button onclick="confirmSide(${a.id},'client',${p.id})">客户确认此清单</button>
     <p class="muted">若一方确认的是另一组文件，系统会拒绝。</p>`}
 </div>`).join('');
 $('#pkg-'+pid).innerHTML=pkgs.map(p=>`<div>交付包 #${p.id}
   <span class="pill ${p.downloadable?'ok':'bad'}">${p.downloadable?'可下载':'授权受阻'}</span>
   ${p.sealed?`<a href="#" onclick="dl(${p.id});return false">下载 ZIP（含 MANIFEST 清单）</a>`:''}</div>`).join('')
   + (accs.some(a=>a.completed)?'<button onclick="sealFor('+pid+')">按已完成验收封包</button>':'');
}
async function confirmSide(id,who,pid){
 const items=JSON.parse(localStorage.getItem('accItems-'+id)||'null');
 if(!items){alert('本地没有该验收清单，请重新发起验收以获取清单');return}
 try{await api('POST','/api/client/acceptances/'+who+'-confirm',{acceptance_id:id,items});
   alert('已记录'+(who==='artist'?'作者':'客户')+'确认');loadAcceptances(pid);
 }catch(e){alert('❌ 确认被拒绝：'+e.message)}
}
async function sealFor(pid){
 const accs=await api('GET','/api/client/acceptances?project_id='+pid);
 const done=accs.find(a=>a.completed);
 if(!done)return alert('没有两方都确认的验收单');
 try{const d=await api('POST','/api/client/packages/seal',{acceptance_id:done.id});
   alert('封包成功 #'+d.package_id+'\n清单严格等于验收通过的素材');loadAcceptances(pid);
 }catch(e){alert('❌ '+e.message)}
}
async function dl(id){
 const r=await fetch('/api/client/packages/'+id+'/download',{headers:H});
 if(!r.ok){const d=await r.json();return alert('❌ '+d.detail)}
 const blob=await r.blob();const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='delivery-'+id+'.zip';a.click();
}
const t=new URLSearchParams(location.search).get('token');
if(t){$('#token').value=t;load()}
</script></body></html>
