<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>创作过程</title><style>
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;background:#fafaf7;color:#1f2330}
header{padding:22px 32px;border-bottom:1px solid #e5e7eb;background:#fff}
.wrap{max-width:960px;margin:0 auto;padding:26px 20px 80px}
.step{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:18px}
.step h3{margin:0 0 4px} .step .meta{color:#6b7280;font-size:13px;margin-bottom:12px}
.assets{display:flex;gap:14px;flex-wrap:wrap}
.figure{width:240px;border:1px solid #eee;border-radius:10px;overflow:hidden;background:#fff}
.figure img{width:100%;display:block} .figure .cap{padding:8px 10px;font-size:12px;color:#555}
.tag{font-size:11px;background:#eef0ff;color:#3b49b0;border-radius:999px;padding:2px 8px}
.arrow{text-align:center;color:#9aa0b4;font-size:20px;margin:-6px 0 12px}
a{color:#5b6ee1}
</style></head><body>
<header><a href="index.html">← 返回作品集</a></header>
<div class="wrap" id="root"><p>加载中…</p></div>
<script>
const id=new URLSearchParams(location.search).get('id');
const labels={master:'成稿 MASTER',process:'过程图 PROCESS',thumbnail:'缩略图 THUMBNAIL'};
fetch('/api/public/works/'+id+'/story').then(async r=>{
 if(!r.ok){document.querySelector('#root').innerHTML='<p>作品不存在、为保密项目，或当前没有可公开展示的版本素材。</p>';return}
 const w=await r.json();
 document.title=w.title+' · 创作过程';
 let html=`<h2>${w.title}</h2><p style="color:#6b7280">${w.summary||''}</p><p class="meta" style="font-size:12px">仅展示当前持有“公开展示权”的具体素材；无展示权的缩略图/过程图不会渲染。</p>`;
 w.versions.forEach((v,i)=>{
   const figs=Object.entries(v.assets).map(([kind,arr])=>arr.map(a=>
     `<div class="figure"><img src="/api/public/files/${a.asset_id}/bytes"><div class="cap"><span class="tag">${labels[kind]||kind}</span> ${a.filename}</div></div>`).join('')).join('');
   html+=`<div class="step"><h3>v${v.seq} · ${v.label}</h3><div class="meta">${v.note||''}</div><div class="assets">${figs}</div></div>`;
   if(i<w.versions.length-1) html+='<div class="arrow">↓ 修改进入下一版</div>';
 });
 document.querySelector('#root').innerHTML=html;
});
</script></body></html>
