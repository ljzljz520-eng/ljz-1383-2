<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>青年插画师工作室 · 公开作品集</title>
<style>
:root{--ink:#1f2330;--muted:#6b7280;--line:#e5e7eb;--bg:#fafaf7;--card:#fff;--accent:#5b6ee1}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 40px;border-bottom:1px solid var(--line);background:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header h1{font-size:20px;margin:0} nav a{margin-left:18px;color:var(--accent);text-decoration:none;font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 24px 80px}
.search{display:flex;gap:8px;margin-bottom:22px} .search input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer}
.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card img{width:100%;height:190px;object-fit:cover;background:#eee;display:block}
.card .b{padding:14px 16px} .card h3{margin:0 0 6px;font-size:16px} .card p{margin:0;color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;background:#eef0ff;color:#3b49b0;border-radius:999px;padding:2px 9px;margin-right:6px}
.section-title{font-size:15px;color:var(--muted);margin:26px 0 12px}
.badge-secret{background:#fdecec;color:#b33838}
.muted{color:var(--muted);font-size:13px}
</style></head>
<body>
<header>
  <h1>🎨 青年插画师工作室 · 公开作品集</h1>
  <nav>
    <a href="commission.html">发起委托</a>
    <a href="client.html">客户门户</a>
    <a href="admin.html">管理后台</a>
  </nav>
</header>
<div class="wrap">
  <div class="search">
    <input id="q" placeholder="搜索作品标题 / 简介（仅返回有公开展示授权的版本）"/>
    <button onclick="doSearch()">搜索</button>
    <button class="ghost" onclick="location.reload()">重置</button>
  </div>

  <div class="section-title">⭐ 首页精选（保密项目与无展示授权的作品不会出现）</div>
  <div id="featured" class="grid"></div>

  <div class="section-title">全部公开作品 · 草图 → 过程图 → 成稿</div>
  <div id="grid" class="grid"></div>
  <p class="muted" id="note"></p>
</div>
<script>
const $ = s => document.querySelector(s);
async function get(u){const r=await fetch(u);if(!r.ok) throw new Error(u+': '+r.status);return r.json()}
function card(w){
  const flat=w.versions.flatMap(v=>Object.entries(v.assets).map(([k,a])=>({k,v,a:a[0]})));
  const thumb=flat.find(x=>x.k==='thumbnail')||flat[0];
  const img=thumb?`/api/public/files/${thumb.a.asset_id}/bytes`:'';
  const kinds=[...new Set(flat.map(x=>x.k))];
  return `<div class="card">
    ${img?`<img src="${img}" alt="">`:'<div style="height:190px;background:#eee"></div>'}
    <div class="b">
      <h3>${w.title}</h3>
      <p>${w.summary||''}</p>
      <p style="margin-top:8px">${kinds.map(k=>`<span class="tag">${({master:'成稿',process:'过程图',thumbnail:'缩略图'})[k]}</span>`).join('')}
      <span class="tag">${w.versions.length} 个版本</span></p>
      <p style="margin-top:10px"><a href="work.html?id=${w.work_id}">查看创作过程 →</a>
      &nbsp;<a href="#" onclick="share(${w.work_id});return false">分享卡</a></p>
    </div></div>`;
}
async function share(id){
  const r=await fetch(`/api/public/share/${id}`);
  if(!r.ok){alert('该作品缺少公开展示的缩略图，无法生成分享卡');return}
  const c=await r.json();
  alert(`分享卡数据\n标题: ${c.title}\n图片: ${location.origin}${c.image_url}\n链接: ${c.url}`);
}
async function load(){
  const [works, featured]=await Promise.all([get('/api/public/works'),get('/api/public/featured')]);
  $('#grid').innerHTML=works.map(card).join('')||'<p class="muted">暂无公开展示作品</p>';
  const fmap=new Map(featured.map(x=>[x.work_id,1]));
  $('#featured').innerHTML=works.filter(w=>fmap.has(w.work_id)).map(card).join('')
    ||'<p class="muted">暂无精选（精选必须同时满足非保密 + 有展示授权）</p>';
  $('#note').textContent=`共 ${works.length} 个公开作品；授权撤回后素材会立即从搜索/展示消失。`;
}
async function doSearch(){
  const q=encodeURIComponent($('#q').value.trim());
  const rows=await get('/api/public/search?q='+q);
  if(!rows.length){$('#grid').innerHTML='<p class="muted">无匹配结果（保密与未授权版本不会命中）</p>';return}
  const all=await Promise.all(rows.map(r=>get('/api/public/works/'+r.work_id+'/story')));
  $('#grid').innerHTML=all.map(card).join('');
}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
load().catch(e=>$('#grid').innerHTML='<p class="muted">加载失败：'+e+'</p>');
</script>
</body></html>
